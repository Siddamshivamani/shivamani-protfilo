
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}Shivamani | Portfolio{% endblock %}</title>

    <!-- CSS using url_for -->
    <link rel="stylesheet" href="{{ url_for('static', path='css/style.css') }}">
</head>

<body class="{{ theme }}">

    <!-- Navbar -->
    <header>
        <nav class="navbar">

            <a href="#home" class="logo">Shivamani.</a>

            <div class="nav-links">
                <a href="#home">Home</a>
                <a href="#about">About</a>
                <a href="#skills">Skills</a>
                <a href="#projects">Projects</a>
                <a href="#education">Education</a>
                <a href="#contact">Contact</a>
            </div>

            <!-- Theme Toggle -->
            <form action="{{ url_for('toggle_theme') }}" method="post">
                <button type="submit" class="theme-btn">
                    {% if theme == "dark" %}
                         White Mode
                    {% else %}
                         Dark Mode
                    {% endif %}
                </button>
            </form>

        </nav>
    </header>

    <!-- Main content from child template -->
    <main>
        {% block content %}
        {% endblock %}
    </main>

    <!-- Footer -->
    <footer>
        <p>&copy; 2026 Siddam Shivamani. All Rights Reserved.</p>
    </footer>

</body>
</html>
